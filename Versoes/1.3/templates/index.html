<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7f4">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="shell">
        <section class="form-side" aria-labelledby="signup-title">
            <h1 id="signup-title">Login</h1>
            <form action="{{ url_for('login') }}" method="POST">
                <div class="field">
                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="email" placeholder="voce@exemplo.com" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="password">Senha</label>
                    <input id="password" name="password" type="password" placeholder="Sua senha" autocomplete="current-password" required>
                </div>
                <button class="submit" type="submit">Fazer login <span aria-hidden="true">→</span></button>
            </form>
            <p>Não tem uma conta? <a href="{{ url_for('register') }}">Cadastre-se</a></p>
        </section>
    </main>
</body>
</html>
